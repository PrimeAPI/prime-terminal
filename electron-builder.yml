appId: dev.prime-terminal.app
productName: Prime Terminal
artifactName: ${name}-${version}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/node-pty/**
extraResources:
  - from: build/icons
    to: icons
afterPack: scripts/after-pack.cjs
npmRebuild: true
publish: null

linux:
  icon: build/icons
  category: System
  executableName: prime-terminal
  synopsis: SSH client with tabs, proxy jumps and port forwarding
  description: Portable SSH client with tabs and windows, saved servers, proxy jumps and port forwarding sets.
  desktop:
    entry:
      Name: Prime Terminal
      GenericName: SSH Client
      Keywords: ssh;terminal;
      StartupWMClass: prime-terminal
      Categories: System;TerminalEmulator;
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

appImage:
  artifactName: ${name}-${version}-x86_64.${ext}

deb:
  artifactName: ${name}_${version}_amd64.${ext}
  appArmorProfile: build/apparmor-profile
  recommends:
    - python3-gi
  fpm:
    - build/linux/search-provider.py=/usr/lib/prime-terminal/search-provider.py
    - build/linux/dev.primeterminal.SearchProvider.service=/usr/share/dbus-1/services/dev.primeterminal.SearchProvider.service
    - build/linux/prime-terminal.search-provider.ini=/usr/share/gnome-shell/search-providers/prime-terminal.search-provider.ini
    - build/linux/primeterminal=/usr/bin/primeterminal

win:
  icon: build/icon.ico
  executableName: prime-terminal
  target:
    - target: portable
      arch: [x64]

portable:
  artifactName: ${name}-${version}-portable.${ext}
